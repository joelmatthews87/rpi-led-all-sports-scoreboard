---
services:
  scoreboard:
    # Build from this repo rather than pulling a prebuilt image. Upstream pulls
    # ghcr.io/gidger/rpi-led-sports-scoreboard, which would silently run without
    # the NFL scenes added in this fork.
    build: .
    image: rpi-led-all-sports-scoreboard:local
    container_name: rpi-led-all-sports-scoreboard
    privileged: true
    restart: unless-stopped
    volumes:
      # Binding config.yaml to allow the container to access the config file.
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
      # Binding assets directory so any added custom alt logos can be used.
      - type: bind
        source: ./assets
        target: /app/assets
        read_only: true
      # Binding localtime to sync RPi and container timezones.
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
